version: '3'

vars:
  ASSIGNMENT_DIR: "Assignment-1"
  JOINED_NB: "{{.ASSIGNMENT_DIR}}/Assignment-1.ipynb"
  OIL_NB: "{{.ASSIGNMENT_DIR}}/oil/Oil.ipynb"
  SALES_NB: "{{.ASSIGNMENT_DIR}}/sales/sales.ipynb"
  IMAGES_NB: "{{.ASSIGNMENT_DIR}}/images/images.ipynb"
  REPORT_TYP: "{{.ASSIGNMENT_DIR}}/report.typ"
  REPORT_PDF: "{{.ASSIGNMENT_DIR}}/Assignment-1-report.pdf"

tasks:
  default:
    desc: "Join notebooks with nbmerge and compile Assignment 1 PDF report"
    cmds:
      - task: join
      - task: pdf

  join:
    desc: "Combine oil, sales, and images notebooks into Assignment-1.ipynb using nbmerge"
    sources:
      - "{{.OIL_NB}}"
      - "{{.SALES_NB}}"
      - "{{.IMAGES_NB}}"
    generates:
      - "{{.JOINED_NB}}"
    cmds:
      - uv run nbmerge {{.OIL_NB}} {{.SALES_NB}} {{.IMAGES_NB}} -o {{.JOINED_NB}}

  pdf:
    desc: "Compile Assignment-1 report PDF from joined notebook using Callisto and Typst"
    deps: [join]
    sources:
      - "{{.JOINED_NB}}"
      - "{{.REPORT_TYP}}"
    generates:
      - "{{.REPORT_PDF}}"
    cmds:
      - typst compile {{.REPORT_TYP}} {{.REPORT_PDF}}

  clean:
    desc: "Remove the generated joined notebook and PDF report"
    cmds:
      - uv run python -c "from pathlib import Path; [p.unlink(missing_ok=True) for p in [Path('{{.JOINED_NB}}'), Path('{{.REPORT_PDF}}')]]; print('Cleaned generated notebook and PDF')"
